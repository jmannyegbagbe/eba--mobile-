name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Buildozer
        uses: digreatbrian/buildozer-action@v2
        with:
          buildozer-cmd: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EbaMobile-APK
          path: bin/*.apk
          
